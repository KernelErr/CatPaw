[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "CatPaw developer tasks: test runners, code generation, fixture fetching"

[dependencies]
anyhow.workspace = true
clap.workspace = true
catpaw-dom = { path = "../crates/catpaw-dom" }
# The web-platform-tests runner needs the engine; the other tasks do not,
# so `cargo xtask bindgen` builds without it (and can regenerate bindings
# the engine does not compile without).
catpaw-bindings-boa = { path = "../crates/catpaw-bindings-boa", optional = true }
catpaw-web = { path = "../crates/catpaw-web", optional = true }
serde_json = { workspace = true, optional = true }
url = { workspace = true, optional = true }
catpaw-webidl = { path = "../crates/catpaw-webidl" }
catpaw-protocol = { path = "../crates/catpaw-protocol" }
catpaw-server = { path = "../crates/catpaw-server", optional = true }
catpaw-net = { path = "../crates/catpaw-net", optional = true }
zstd = { workspace = true, optional = true }
mimalloc = { version = "0.1", optional = true, default-features = false }

[features]
wpt = ["dep:catpaw-bindings-boa", "dep:catpaw-web", "dep:serde_json", "dep:url"]
engine = ["dep:catpaw-server", "dep:catpaw-net", "dep:serde_json", "dep:url", "dep:zstd", "mimalloc"]
# mimalloc as the global allocator, as the catpaw binary has it by default:
# the engine runs here (task replays, snapshot sizes) as it does for agents.
mimalloc = ["dep:mimalloc"]
