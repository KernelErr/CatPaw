[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0 OR MIT"
authors = ["The CatPaw Contributors"]
repository = "https://github.com/KernelErr/CatPaw"
homepage = "https://github.com/KernelErr/CatPaw"
keywords = ["browser", "headless", "agent", "html", "llm"]

[workspace.dependencies]
# --- engine-side ---
boa_engine = "0.22"
boa_gc = "0.22"
html5ever = "0.40"
markup5ever = "0.40"
stylo = "0.22"
stylo_dom = "0.22"
stylo_traits = "0.22"
stylo_atoms = "0.22"
selectors = "0.41"
cssparser = "0.38"
taffy = "0.14"
parley = "0.11"
fontique = "0.11"
tiny-skia = "0.12"
weedle2 = "5"
slotmap = "1.1"
encoding_rs = "0.8"
url = "2.5"
atomic_refcell = "0.1"
stylo_static_prefs = "0.22"
euclid = "0.22"
app_units = "0.7"
smallvec = "1"

# --- networking ---
hyper = { version = "1.11", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "tls12", "logging", "webpki-tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "fs"] }
http = "1.5"
http-body-util = "0.1"
bytes = "1"
hickory-resolver = "0.26"
cookie_store = "0.22"
cookie = "0.18"
web-bot-auth = "0.7"
flate2 = "1"
brotli = "9"
zstd = "0.14"
indexmap = "2"
base64 = "0.23"
getrandom = "0.3"
ed25519-dalek = "3"

# --- cli / utilities ---
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
png = "0.18"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = 1
