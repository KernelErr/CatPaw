name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: Generated bindings are up to date
        run: cargo run -p xtask -- bindgen --check
      - name: Test
        run: cargo test --workspace
      - name: tree-construction (WPT html5lib suite)
        run: cargo run -p xtask -- tree-construction
      - name: web-platform-tests (testharness.js subsets)
        # The engine is the same on every platform; one run of the suites is enough.
        if: runner.os == 'Linux'
        run: cargo run -p xtask --features wpt -- wpt --include dom --include html/dom --include fetch/api --include xhr --jobs 4 --kill-after 20
