# Third-party notices for the release archives:
#   cargo about generate --locked --fail -c release/about.toml -m crates/catpaw/Cargo.toml \
#       release/about.hbs -o THIRD-PARTY-LICENSES.html
# A dependency under a license not listed here fails the generation.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MPL-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "Unicode-3.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
]
# What the release binaries are built for.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
# Build scripts, procedural macros and test tools are not in the binary.
ignore-build-dependencies = true
ignore-dev-dependencies = true
