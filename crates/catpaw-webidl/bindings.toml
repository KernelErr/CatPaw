# The binding manifest: which interfaces get JavaScript bindings and which of
# their members are implemented.
#
# - `members`: implemented natively. `cargo xtask bindgen` generates a trait
#   method for each one; `catpaw-web` must implement it.
# - `stubs`: defined, but a no-op returning `undefined`. Use sparingly, for
#   methods pages call unconditionally.
# - `constructor = true`: `new Interface(...)` works (needs a `constructor`
#   implementation).
# - `exotic = true`: the interface's indexed/named special operations are
#   wired up (the wrapper becomes a proxy).
#
# Anything not listed is simply absent, so feature detection stays honest.
# Two kinds of members need no entry: attributes annotated `[Reflect*]` in the
# HTML IDL (generated as content-attribute reflection) and `on*` event handler
# attributes.
#
# `cargo xtask bindgen --list <Interface>` shows what an interface offers.

# ---------------------------------------------------------------- DOM: events

[interfaces.EventTarget]
constructor = true
members = ["addEventListener", "removeEventListener", "dispatchEvent"]

[interfaces.Event]
constructor = true
members = [
  "type", "target", "srcElement", "currentTarget", "composedPath", "eventPhase",
  "stopPropagation", "cancelBubble", "stopImmediatePropagation", "bubbles", "cancelable",
  "returnValue", "preventDefault", "defaultPrevented", "composed", "isTrusted", "timeStamp",
  "initEvent",
]

[interfaces.CustomEvent]
constructor = true
members = ["detail", "initCustomEvent"]

# ----------------------------------------------------------------- DOM: nodes

[interfaces.Node]
members = [
  "nodeType", "nodeName", "baseURI", "isConnected", "ownerDocument", "getRootNode",
  "parentNode", "parentElement", "hasChildNodes", "childNodes", "firstChild", "lastChild",
  "previousSibling", "nextSibling", "nodeValue", "textContent", "normalize", "cloneNode",
  "isEqualNode", "isSameNode", "compareDocumentPosition", "contains", "insertBefore",
  "appendChild", "replaceChild", "removeChild",
]

[interfaces.Document]
members = [
  "URL", "documentURI", "compatMode", "characterSet", "charset", "inputEncoding",
  "contentType", "doctype", "documentElement", "getElementsByTagName",
  "getElementsByClassName", "createElement", "createElementNS", "createDocumentFragment",
  "createTextNode", "createComment", "importNode", "adoptNode", "createEvent",
  "location", "referrer", "cookie", "readyState", "title", "body", "head",
  "getElementsByName", "currentScript", "defaultView", "hasFocus", "hidden",
  "visibilityState", "write", "writeln", "open", "close",
]

[interfaces.DocumentType]
members = ["name", "publicId", "systemId"]

[interfaces.DocumentFragment]
constructor = true

[interfaces.Element]
members = [
  "namespaceURI", "prefix", "localName", "tagName", "id", "className", "classList", "slot",
  "hasAttributes", "getAttributeNames", "getAttribute", "getAttributeNS", "setAttribute",
  "setAttributeNS", "removeAttribute", "removeAttributeNS", "toggleAttribute",
  "hasAttribute", "hasAttributeNS", "closest", "matches", "webkitMatchesSelector",
  "getElementsByTagName", "getElementsByClassName", "insertAdjacentElement",
  "insertAdjacentText", "innerHTML", "outerHTML", "insertAdjacentHTML",
  "getBoundingClientRect", "scrollIntoView", "scrollTop", "scrollLeft", "scrollWidth",
  "scrollHeight", "clientTop", "clientLeft", "clientWidth", "clientHeight",
]

[interfaces.CharacterData]
members = [
  "data", "length", "substringData", "appendData", "insertData", "deleteData", "replaceData",
]

[interfaces.Text]
constructor = true
members = ["splitText", "wholeText"]

[interfaces.Comment]
constructor = true

[mixins.NonElementParentNode]
members = ["getElementById"]

[mixins.ParentNode]
members = [
  "children", "firstElementChild", "lastElementChild", "childElementCount", "prepend",
  "append", "replaceChildren", "querySelector", "querySelectorAll",
]

[mixins.ChildNode]
members = ["before", "after", "replaceWith", "remove"]

[mixins.NonDocumentTypeChildNode]
members = ["previousElementSibling", "nextElementSibling"]

[mixins.DocumentOrShadowRoot]
members = ["activeElement"]

# ---------------------------------------------------------- DOM: collections

[interfaces.NodeList]
exotic = true
members = ["item", "length"]

[interfaces.HTMLCollection]
exotic = true
members = ["length", "item", "namedItem"]

[interfaces.DOMTokenList]
exotic = true
