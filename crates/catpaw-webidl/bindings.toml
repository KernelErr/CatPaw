# ------------------------------------------------------------------- console

[namespaces.console]
members = [
  "assert", "clear", "debug", "error", "info", "log", "table", "trace", "warn", "dir",
  "dirxml", "count", "countReset", "group", "groupCollapsed", "groupEnd", "time", "timeLog",
  "timeEnd",
]

