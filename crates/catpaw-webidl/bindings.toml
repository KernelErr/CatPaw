  "length", "item", "contains", "add", "remove", "toggle", "replace", "supports", "value",
]

[interfaces.DOMStringMap]
exotic = true

[interfaces.DOMRectReadOnly]
members = ["x", "y", "width", "height", "top", "right", "bottom", "left", "toJSON"]

[interfaces.DOMRect]
