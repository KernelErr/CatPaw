[package]
name = "catpaw"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories = ["command-line-utilities", "web-programming"]
readme = "../../README.md"
description = "CatPaw: a headless-first browser for AI agents"

[[bin]]
name = "catpaw"
path = "src/main.rs"

[features]
default = ["mimalloc"]
# mimalloc as the global allocator: an MCP session that loads one large
# page twelve times peaks at about 315 MB with it, 470 MB without (the
# system allocator fragments), and takes about a tenth less CPU.
mimalloc = ["dep:mimalloc"]

[dependencies]
catpaw-net = { path = "../catpaw-net", version = "0.0.1" }
catpaw-fetch = { path = "../catpaw-fetch", version = "0.0.1" }
catpaw-dom = { path = "../catpaw-dom", version = "0.0.1" }
catpaw-agent = { path = "../catpaw-agent", version = "0.0.1" }
clap.workspace = true
tokio.workspace = true
anyhow.workspace = true
url.workspace = true
catpaw-style = { path = "../catpaw-style", version = "0.0.1" }
catpaw-engine = { path = "../catpaw-engine", version = "0.0.1" }
catpaw-server = { path = "../catpaw-server", version = "0.0.1" }
serde_json.workspace = true
toml = "0.9"
mimalloc = { version = "0.1", optional = true, default-features = false }
