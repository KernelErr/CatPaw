[package]
name = "catpaw-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories = ["web-programming"]
description = "The CatPaw browser's page engine: pages, frames, popups and workers on one thread, their network and their event loops"

[dependencies]
catpaw-bindings-boa = { path = "../catpaw-bindings-boa", version = "0.1.1" }
catpaw-dom = { path = "../catpaw-dom", version = "0.1.1" }
catpaw-style = { path = "../catpaw-style", version = "0.1.1" }
catpaw-fetch = { path = "../catpaw-fetch", version = "0.1.1" }
catpaw-js = { path = "../catpaw-js", version = "0.1.1" }
catpaw-net = { path = "../catpaw-net", version = "0.1.1" }
catpaw-web = { path = "../catpaw-web", version = "0.1.1" }
bytes.workspace = true
http.workspace = true
thiserror.workspace = true
tokio.workspace = true
url.workspace = true

[dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
